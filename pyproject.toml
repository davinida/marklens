# 저장소 공통 pytest 설정 (패키징 아님 — [project] 섹션 없음).
# 루트에서 `pytest` 만 치면 백엔드 + ml 테스트가 함께 돈다.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["backend/tests", "ml/tests"]
markers = [
    "slow: 실모델 로딩/외부 네트워크 등 무거운 테스트 (선택 실행: -m slow)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["ml/venv", "ml/data"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"ml/scripts/kipris_search.py" = ["E402"]
"ml/scripts/test_search.py" = ["E402"]
