name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            ml/requirements.txt
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install CPU inference runtime
        run: |
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install setuptools==83.0.0

      - name: Install dependencies
        run: >-
          pip install -c constraints.txt
          -r ml/requirements.txt
          -r backend/requirements.txt
          -r backend/requirements-dev.txt

      - name: Static checks
        run: |
          ruff check backend ml
          pip check

      - name: Run tests
        run: pytest -v
        env:
          MARKLENS_FAKE_ML: "1"
          MARKLENS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marklens_test

      - name: Audit installed Python packages
        run: pip-audit --local --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
        env:
          CI: "1"
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose contract
        run: docker compose -f compose.production.yml config --quiet
        env:
          PUBLIC_ORIGIN: https://marklens.example.com
          POSTGRES_PASSWORD: ci-only-password
          MARKLENS_API_KEY: ci-only-api-key-000000000000000000000000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          MARKLENS_TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          MARKLENS_TURNSTILE_EXPECTED_HOSTNAMES: marklens.example.com
          KIPRIS_ACCESS_KEY: ci-placeholder-not-used

      # nginx 는 config 테스트 시점에 upstream 호스트명을 해석한다. "frontend"는
      # compose 네트워크 DNS 이름이라 단독 컨테이너에서는 host not found 로 실패
      # → /etc/hosts 별칭을 줘서 어느 환경에서든 문법 검증이 돌게 한다.
      - name: Validate Nginx gateway syntax
        run: >-
          docker run --rm
          --add-host frontend:127.0.0.1
          -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.29-alpine nginx -t
