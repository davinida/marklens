events {}

http {
    server_tokens off;

    # The trusted TLS edge must strip any client-supplied copy and set this
    # header from its verified source address. The Compose port binds to
    # loopback by default so untrusted clients cannot forge the rate-limit key.
    map $http_x_marklens_client_ip $marklens_client_ip {
        ""      $remote_addr;
        default $http_x_marklens_client_ip;
    }

    limit_req_zone $marklens_client_ip zone=search_per_ip:10m rate=5r/m;
    limit_req_zone $marklens_client_ip zone=namecheck_per_ip:10m rate=2r/m;
    # /api/images 는 frontend BFF 가 서버사이드로 백엔드에 중계한다 — 백엔드에는 항상
    # frontend 컨테이너 단일 IP 로 보이므로 백엔드 한도는 사이트 전체 백스톱일 뿐이다.
    # 클라이언트별 한도는 여기(에지)에서만 걸 수 있다. 결과 화면 1회 = 최대 top_k(20)장이라
    # 검색 한도(5r/m) × 20장 = 100r/m 에 여유를 더해 120r/m.
    limit_req_zone $marklens_client_ip zone=images_per_ip:10m rate=120r/m;
    limit_conn_zone $marklens_client_ip zone=connections_per_ip:10m;

    log_format marklens '$remote_addr client=$marklens_client_ip request_id=$request_id '
                        '"$request" $status $body_bytes_sent';

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream marklens_frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        access_log /var/log/nginx/access.log marklens;
        limit_conn connections_per_ip 10;
        limit_conn_status 429;
        limit_req_status 429;
        limit_req_log_level warn;
        client_body_timeout 15s;
        client_header_timeout 10s;
        keepalive_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $marklens_client_ip;
        proxy_set_header X-Forwarded-For $marklens_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-MarkLens-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_hide_header X-Request-ID;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header X-Request-ID $request_id always;

        error_page 429 = @rate_limited;

        location @rate_limited {
            internal;
            default_type application/json;
            add_header Retry-After 30 always;
            add_header X-Request-ID $request_id always;
            return 429 '{"detail":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
        }

        location = /api/search {
            limit_req zone=search_per_ip burst=2 nodelay;
            client_max_body_size 11m;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_pass http://marklens_frontend;
        }

        location = /api/name-check {
            limit_req zone=namecheck_per_ip burst=1 nodelay;
            client_max_body_size 32k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_pass http://marklens_frontend;
        }

        # 결과 화면 1회가 최대 20장을 동시에 요청하므로 burst 는 한 화면분(20)보다 넉넉히
        # 두고 nodelay 로 즉시 통과시킨다 — 지연 대기열은 이미지 표시를 눈에 띄게 늦춘다.
        location ^~ /api/images/ {
            limit_req zone=images_per_ip burst=40 nodelay;
            client_max_body_size 1k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_pass http://marklens_frontend;
        }

        location / {
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_pass http://marklens_frontend;
        }
    }
}
