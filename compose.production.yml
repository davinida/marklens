name: marklens

services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${MARKLENS_BIND_ADDRESS:-127.0.0.1}:${MARKLENS_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?set NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MARKLENS_BACKEND_URL: http://backend:8000
      MARKLENS_BACKEND_API_KEY: ${MARKLENS_API_KEY:?set MARKLENS_API_KEY}
      # 사이트 키는 이제 런타임(/api/turnstile-config)으로도 전달된다 — 재빌드 없이
      # 키 교체 가능. 빌드 arg 는 구버전 클라이언트 인라인 경로용으로 함께 유지.
      MARKLENS_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?set NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      MARKLENS_TURNSTILE_SECRET_KEY: ${MARKLENS_TURNSTILE_SECRET_KEY:?set MARKLENS_TURNSTILE_SECRET_KEY}
      MARKLENS_TURNSTILE_EXPECTED_HOSTNAMES: ${MARKLENS_TURNSTILE_EXPECTED_HOSTNAMES:?set MARKLENS_TURNSTILE_EXPECTED_HOSTNAMES}
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, internal]

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      MARKLENS_ENVIRONMENT: production
      MARKLENS_API_KEY: ${MARKLENS_API_KEY:?set MARKLENS_API_KEY}
      DATABASE_URL: postgresql://marklens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/marklens
      MARKLENS_DATA_DIR: /data
      MARKLENS_IMAGES_DIR: /data/images
      MARKLENS_PUBLIC_RESULT_IMAGES: ${MARKLENS_PUBLIC_RESULT_IMAGES:-false}
      MARKLENS_CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      MARKLENS_SEARCH_CONCURRENCY: "2"
      MARKLENS_SEARCH_RATELIMIT: 120/minute
      MARKLENS_NAMECHECK_RATELIMIT: 60/minute
      # /images 는 브라우저가 아니라 frontend BFF 가 서버사이드로 호출한다 — 백엔드에는
      # 항상 frontend 컨테이너 단일 IP 로 보이므로 이 값은 IP별 한도가 아니라 사이트 전체
      # 백스톱이다(클라이언트별 한도는 deploy/nginx.conf 의 images_per_ip 존이 담당).
      # 검색 백스톱 120/minute × 결과 화면당 최대 top_k(20)장 = 2400/minute.
      MARKLENS_IMAGES_RATELIMIT: ${MARKLENS_IMAGES_RATELIMIT:-2400/minute}
      KIPRIS_ACCESS_KEY: ${KIPRIS_ACCESS_KEY:?set rotated KIPRIS_ACCESS_KEY}
      KIPRIS_BASE_URL: https://plus.kipris.or.kr/
      # 일일 호출 예산. 미캐시 name-check 1건 = 최대 5회 호출(NAME_SEARCH_MAX_PAGES)이라
      # 기본 80 이면 하루 약 16건에서 소진된다. 정책값은 유지하되 조용히 걸리지 않도록
      # 여기에 노출한다(0 이하면 일일 검사 비활성).
      KIPRIS_DAILY_BUDGET: ${KIPRIS_DAILY_BUDGET:-80}
      KIPRIS_COUNTER_PATH: /state/kipris_call_count.json
      HF_HOME: /models/huggingface
    volumes:
      - ./ml/data:/data:ro
      - marklens-state:/state
      - marklens-model-cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, backend-egress]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marklens
      POSTGRES_USER: marklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - marklens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marklens -d marklens"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

networks:
  edge:
  internal:
    internal: true
  backend-egress:

volumes:
  marklens-postgres:
  marklens-state:
  marklens-model-cache:
