<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 밖으로 아무것도 보내지 않는다: 스크립트·스타일은 이 파일 안의 것만, 그림은 옆 폴더의 파일만 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>유명 상표 고르기</title>
<style>
:root{--bg:#fbfaf7;--panel:#f3f1ea;--ink:#1d1c19;--sub:#5f5b52;--line:#d9d5cb;--mark:#f6e7b4;
--accent:#b4541a;--accent-ink:#fff;--ok:#2f6b3c;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#191815;--panel:#211f1b;--ink:#ece9e1;--sub:#a8a397;
--line:#3a372f;--mark:#4a3f16;--accent:#e8935a;--accent-ink:#191815;--ok:#7fc08c;--card:#24221d}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:4px 10px}
button:hover{border-color:var(--sub)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.plain{border-color:transparent;background:none;padding:2px 6px;color:var(--sub)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],textarea,select{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:4px 7px;width:100%}
textarea{resize:vertical;min-height:54px}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;
background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0 8px 0 0}
.top .status{color:var(--sub);font-size:12.5px;margin-right:auto}
.top .status.bad{color:var(--accent);font-weight:600}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100% - 46px)}
nav{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;position:sticky;top:46px;
height:calc(100vh - 46px);padding:10px 8px 30px}
main{padding:14px 18px 80px;min-width:0}
.summary{font-size:12.5px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px 9px;margin-bottom:10px}
.summary b{font-variant-numeric:tabular-nums}
.summary .none{color:var(--sub);margin-top:4px;overflow-wrap:anywhere}
.summary .none a{color:inherit}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
.filters button{font-size:12px;padding:2px 7px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.blist{list-style:none;margin:0;padding:0}
.blist li button{display:flex;width:100%;text-align:left;gap:6px;align-items:baseline;border:0;border-radius:3px;
background:none;padding:4px 6px}
.blist li button[aria-current=true]{background:var(--ink);color:var(--bg)}
.blist .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.blist .off .nm{text-decoration:line-through;opacity:.6}
.tag{font-size:11px;white-space:nowrap;color:var(--sub)}
[aria-current=true] .tag{color:inherit;opacity:.85}
.tag.logo{color:var(--ok);font-weight:600}.tag.fetch{color:var(--accent);font-weight:600}
[aria-current=true] .tag.logo,[aria-current=true] .tag.fetch{color:inherit}
h2{font-size:19px;margin:0 0 2px}
h3{font-size:14px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
h3 small{font-weight:400;color:var(--sub);margin-left:6px}
.sub{color:var(--sub);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;max-width:900px}
label.f{display:block;font-size:12.5px;color:var(--sub)}
label.f>span{display:block;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:1px 3px 1px 7px;background:var(--card)}
.kind{font-size:11.5px;padding:0 5px;border-radius:3px;background:var(--panel);color:var(--sub);white-space:nowrap}
.kind.weak,.kind.initial{background:var(--mark);color:var(--ink)}
table.nt{border-collapse:collapse;max-width:900px;width:100%}
table.nt td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle}
table.nt tr.removed td:first-child{text-decoration:line-through;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:7px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.dim{opacity:.62}
.thumb{display:block;width:100%;height:132px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb.none{display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;cursor:default}
.card .no{font-variant-numeric:tabular-nums;font-size:12.5px}
.card .ti{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.card .meta{font-size:12px;color:var(--sub);overflow-wrap:anywhere;line-height:1.4}
.card .who{font-size:12.5px;font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.card .who.own{color:var(--ok)}.card .who.other{color:var(--accent)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:auto}
.roles button{font-size:11.5px;padding:3px 2px;line-height:1.25}
.roles button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.roles button.logo[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick{display:flex;gap:6px;align-items:center;margin-top:auto}
.pick label{white-space:nowrap}
.pick select{font-size:12px;padding:2px 4px;flex:1;min-width:0}
.summary summary{cursor:pointer}
.note{background:var(--mark);padding:6px 9px;border-radius:4px;font-size:12.5px;max-width:900px}
.err{color:var(--accent);font-weight:600}
.box{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel);max-width:900px}
details.help{max-width:900px;margin:8px 0 0}
details.help summary{cursor:pointer;color:var(--sub)}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:10px;padding:20px}
.lightbox img{max-width:min(92vw,900px);max-height:78vh;background:#fff;object-fit:contain}
.lightbox p{color:#fff;margin:0;text-align:center;overflow-wrap:anywhere;max-width:92vw}
[hidden]{display:none!important}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
.grid2{grid-template-columns:1fr}main{padding:12px 12px 80px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .12s}}
</style>
</head>
<body>
<div class="top">
  <h1>유명 상표 고르기</h1>
  <span class="status" id="status" role="status"></span>
  <button id="btn-export" class="primary">내보내기</button>
  <button id="btn-import">가져오기</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <button id="btn-new">새 브랜드 더하기</button>
  <button id="btn-reset" class="plain">처음부터</button>
</div>
<div class="wrap">
  <nav aria-label="브랜드">
    <div class="summary" id="summary"></div>
    <div class="filters" id="filters"></div>
    <ul class="blist" id="blist"></ul>
  </nav>
  <main id="main"></main>
</div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="큰 그림">
  <img alt="" id="lightbox-img"><p id="lightbox-cap"></p><button id="lightbox-close">닫기 (Esc)</button>
</div>
<script type="application/json" id="data">/*__DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const [R_NOW, R_OLD, R_OTHER, R_NONE] = DATA.roles;
const ROLE_SHORT = {[R_NOW]: "대표 로고(현재)", [R_OLD]: "과거 로고", [R_OTHER]: "그 밖의 표장", [R_NONE]: "관련 없음"};
// 저장 키는 DB 세대와 적용된 overrides 별 — 둘 중 하나가 바뀌어 다시 만든 도구는 적용된 overrides 에서 시작한다
const STORE_KEY = "marklens-famous-curate-v1" + (DATA.db_generation ? ":" + DATA.db_generation : "") + (DATA.overrides_key ? ":" + DATA.overrides_key : "");
const $ = (id) => document.getElementById(id);

// ---- 작은 도구 ----
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const lines = (text) => String(text || "").split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
const uniq = (list) => [...new Set(list)];
const sameList = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const digits = (text) => String(text || "").replace(/\D/g, "");
const fmtDate = (d) => { const s = digits(d); return s.length === 8 ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}` : (d || ""); };

// ---- 상태 ----
const META = new Map();   // key → 브랜드 자료(자동 값 base, DB 표장, 후보)
let ORDER = [];           // 보이는 순서
let state = null;         // {brands: {key: …}, custom: [사람이 더한 브랜드의 자료], current: key, filter}

function customMeta(key) {
  return {key, proposed: false, custom: true,
          base: {name: key, is_new: true, applicants: [], preset: null, urls: [], evidence_text: "",
                 protection_default: DATA.protections[1], notations: []},
          kinds: {}, marks: [], candidates: [], search: null};
}
function loadMeta(custom) {
  META.clear(); ORDER = [];
  for (const b of DATA.brands) { META.set(b.key, b); ORDER.push(b.key); }
  for (const key of custom || []) if (!META.has(key)) { META.set(key, customMeta(key)); ORDER.push(key); }
}
function defaultBrand(b) {
  return {include: true, name: b.base.name, applicants: [...b.base.applicants], preset: b.base.preset,
          urls: [...b.base.urls], protection: b.base.protection_default,
          notations: b.base.notations.map((text) => ({text, base: true, removed: false, common: false})),
          exceptions: [], marks: {}, cand: {}, direct: [], memo: "", core: []};
}
function parseClasses(text) {
  return uniq((text.match(/\d+/g) || []).map(Number).filter((n) => n >= 1 && n <= 45)).sort((a, b) => a - b);
}
function applyOverride(st, ov, b) {
  if (ov.name) st.name = ov.name;
  if ("applicants" in ov) st.applicants = [...ov.applicants];
  if ("preset" in ov) st.preset = ov.preset || null;
  if ("core_classes" in ov) st.core = [...ov.core_classes];
  if ("evidence_urls" in ov) st.urls = [...ov.evidence_urls];
  if (ov.protection) st.protection = ov.protection;
  const edit = ov.notations || {};
  for (const n of st.notations) if ((edit.remove || []).includes(n.text)) n.removed = true;
  for (const text of edit.add || []) if (!st.notations.some((n) => n.text === text)) st.notations.push({text, base: false, removed: false, common: false});
  for (const n of st.notations) if ((edit.common || []).includes(n.text)) n.common = true;
  st.exceptions = [...(ov.exceptions || [])];
  st.marks = Object.assign({}, ov.marks || {});
  const candidates = new Set(b.candidates.map((c) => c.appno));
  const inBrand = new Set(b.marks.map((m) => m.appno));
  for (const f of ov.fetch || []) {
    if (inBrand.has(f.appno)) st.marks[f.appno] = f.role;  // 받아서 DB 에 들어온 표장 — 역할만
    else if (candidates.has(f.appno)) st.cand[f.appno] = {fetch: true, role: f.role};
    else st.direct.push({appno: f.appno, role: f.role});
  }
  st.memo = ov.memo || "";
}
function stateFromOverrides(overrides) {
  const brands = overrides.brands || {};
  const custom = Object.keys(brands).filter((key) => brands[key].new && !DATA.brands.some((b) => b.key === key));
  loadMeta(custom);
  const next = {brands: {}, custom, current: ORDER[0], filter: "all"};
  for (const key of ORDER) {
    const b = META.get(key), st = defaultBrand(b), ov = brands[key];
    if (ov) applyOverride(st, ov, b);
    // 가져온 파일에 없는 새 브랜드는 그 파일을 내보낼 때 뺀 것이다(처음 상태에서는 제안된 브랜드를 넣어 둔다)
    else if (b.base.is_new && overrides !== DATA.initial_overrides) st.include = false;
    next.brands[key] = st;
  }
  return next;
}
function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && saved.brands) {
      loadMeta(saved.custom || []);
      for (const key of ORDER) if (!saved.brands[key]) saved.brands[key] = defaultBrand(META.get(key));
      if (!META.has(saved.current)) saved.current = ORDER[0];
      saved.filter = saved.filter || "all";
      return [saved, true];
    }
  } catch (e) { /* 저장소를 못 써도 도구는 돈다 */ }
  return [stateFromOverrides(DATA.initial_overrides), false];
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      setStatus(`브라우저에 저장됨 ${new Date().toLocaleTimeString("ko-KR")}`);
    } catch (e) {
      setStatus("브라우저에 저장하지 못했습니다 — \"내보내기\"로 남겨 두세요", true);
    }
  }, 250);
}
function setStatus(text, bad) { const el = $("status"); el.textContent = text; el.className = "status" + (bad ? " bad" : ""); }
function changed() { save(); renderNav(); }

// ---- 내보내기(overrides JSON) ----
function defaultRole(b, appno) { const m = b.marks.find((x) => x.appno === appno); return m ? m.default_role : null; }
function fetchList(b, st) {
  const out = [], seen = new Set();
  for (const m of b.marks) {  // 출원번호로 골라 이어 둔 표장 — fetch 에 남아야 계속 이어진다
    if (!m.via_fetch) continue;
    seen.add(m.appno);
    const row = {appno: m.appno, role: st.marks[m.appno] || m.default_role, source: m.via_fetch};
    if (m.title) row.title = m.title;
    if (m.applicant) row.applicant = m.applicant.split("|")[0].trim();
    out.push(row);
  }
  for (const c of b.candidates) {
    const pick = st.cand[c.appno];
    if (!pick || !pick.fetch || c.in_brand || seen.has(c.appno)) continue;
    seen.add(c.appno);
    const row = {appno: c.appno, role: pick.role || R_NOW, source: "후보"};
    if (c.title) row.title = c.title;
    if (c.applicants.length) row.applicant = c.applicants[0];
    out.push(row);
  }
  for (const d of st.direct) {
    const appno = digits(d.appno);
    if (!appno || seen.has(appno)) continue;
    seen.add(appno);
    out.push({appno, role: d.role || R_NOW, source: "직접"});
  }
  return out;
}
function brandOverride(b, st) {
  const isNew = b.base.is_new, o = {};
  if (isNew) { if (!st.include) return null; o.new = true; }
  const name = st.name.trim();
  if (name && name !== b.key) o.name = name;
  const applicants = uniq(st.applicants.map((s) => s.trim()).filter(Boolean));
  if (isNew || !sameList(applicants, b.base.applicants)) o.applicants = applicants;
  if (isNew ? st.preset : st.preset !== b.base.preset) o.preset = st.preset || null;
  if ((st.core || []).length) o.core_classes = [...st.core];
  const urls = uniq(st.urls.map((s) => s.trim()).filter(Boolean));
  if (isNew ? urls.length : !sameList(urls, b.base.urls)) o.evidence_urls = urls;
  if (st.protection !== b.base.protection_default) o.protection = st.protection;
  const kept = st.notations.filter((n) => !n.removed);
  const edit = {};
  const remove = st.notations.filter((n) => n.base && n.removed).map((n) => n.text);
  const add = kept.filter((n) => isNew || !n.base).map((n) => n.text);
  const common = kept.filter((n) => n.common).map((n) => n.text);
  if (remove.length && !isNew) edit.remove = remove;
  if (add.length) edit.add = add;
  if (common.length) edit.common = common;
  if (Object.keys(edit).length) o.notations = edit;
  if (st.exceptions.length) o.exceptions = [...st.exceptions];
  const marks = {};
  const viaFetch = new Set(b.marks.filter((m) => m.via_fetch).map((m) => m.appno));
  // 사람이 고른 역할은 기본값과 같아도 남긴다(표기를 고쳐 기본값이 바뀌어도 고른 것이 유지되게).
  // 기본값을 다시 누르면 고른 것이 지워진다(markCard).
  for (const [appno, role] of Object.entries(st.marks)) if (role && !viaFetch.has(appno) && defaultRole(b, appno) !== null) marks[appno] = role;
  if (Object.keys(marks).length) o.marks = marks;
  const fetch = fetchList(b, st);
  if (fetch.length) o.fetch = fetch;
  if (st.memo.trim()) o.memo = st.memo.trim();
  return Object.keys(o).length ? o : null;
}
function problems() {
  const out = [], names = new Map();
  for (const key of ORDER) {
    const b = META.get(key), st = state.brands[key];
    if (b.base.is_new && !st.include) continue;
    const shown = (st.name.trim() || key);
    names.set(shown, (names.get(shown) || 0) + 1);
    if (!st.notations.some((n) => !n.removed)) out.push(`${shown}: 표기가 하나도 없습니다`);
    for (const d of st.direct) if (d.appno.trim() && digits(d.appno).length !== 13) out.push(`${shown}: 받을 출원번호 "${d.appno}" 는 숫자 13자리가 아닙니다`);
  }
  for (const [name, n] of names) if (n > 1) out.push(`브랜드 이름이 겹칩니다: ${name}`);
  return out;
}
function toOverrides() {
  const brands = {};
  for (const key of ORDER) { const o = brandOverride(META.get(key), state.brands[key]); if (o) brands[key] = o; }
  return {version: DATA.overrides_version, purpose: DATA.overrides_purpose, brands};
}
function doExport() {
  const bad = problems();
  if (bad.length) { alert("내보내기 전에 고칠 것:\n\n" + bad.join("\n")); return; }
  const data = toOverrides();
  const blob = new Blob([JSON.stringify(data, null, 1) + "\n"], {type: "application/json"});
  const a = h("a", {href: URL.createObjectURL(blob), download: "famous_registry_overrides.json"});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setStatus("내보냈습니다 — 내려받은 파일을 famous_registry.py apply 에 넘깁니다");
}
function doImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.version !== DATA.overrides_version) throw new Error(`version 이 ${DATA.overrides_version} 가 아닙니다`);
      state = stateFromOverrides(data);
      save(); renderAll(); setStatus(`가져왔습니다: ${file.name}`);
    } catch (e) { alert("가져오지 못했습니다: " + e.message); }
  };
  reader.readAsText(file);
}

// ---- 요약·목록 ----
function brandStats(key) {
  const b = META.get(key), st = state.brands[key];
  let now = 0, old = 0;
  for (const m of b.marks) { const role = st.marks[m.appno] || m.default_role; if (role === R_NOW) now++; else if (role === R_OLD) old++; }

function openLightbox(src, caption) {
  lastFocus = document.activeElement;
  $("lightbox-img").src = src; $("lightbox-cap").textContent = caption; $("lightbox").hidden = false; $("lightbox-close").focus();
}
function closeLightbox() { $("lightbox").hidden = true; $("lightbox-img").removeAttribute("src"); if (lastFocus) lastFocus.focus(); }
$("lightbox").addEventListener("click", (e) => { if (e.target.id !== "lightbox-img") closeLightbox(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("lightbox").hidden) closeLightbox(); });

// ---- 시작 ----
function renderAll() { renderNav(); renderBrand(); }
$("btn-export").addEventListener("click", doExport);
$("btn-import").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { if (e.target.files[0]) doImport(e.target.files[0]); e.target.value = ""; });
$("btn-new").addEventListener("click", addBrand);
$("btn-reset").addEventListener("click", () => {
  if (!confirm("이 브라우저에 저장한 작업을 버리고 처음 상태(저장소의 overrides)로 돌아갈까요?")) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* 무시 */ }
  state = stateFromOverrides(DATA.initial_overrides); renderAll(); setStatus("처음 상태입니다");
});
const [restored, fromStore] = restore();
state = restored;
renderAll();
setStatus(fromStore ? "이 브라우저에 저장된 작업을 이어 엽니다"
  : `만든 때 ${DATA.generated} · DB ${DATA.db_count}건 · 적용된 overrides 에서 시작합니다`);
window.__curate = {toOverrides, problems, state: () => state};  // 점검용
</script>
</body>
</html>
